<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregador - Estação da Pizza</title>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="css/entregador.css">
</head>
<body>
    <header class="logo-topo">
        <img src="../imagens/logo.png" alt="Estação da Pizza">
        <h1>🛵 Entregas</h1>
        <div class="acoes-cabecalho-entregador">
            <button id="btn-tema-claro" type="button" title="Alternar modo claro"><span class="icone" data-icone="sol"></span> Modo Claro</button>
            <button id="btn-ativar-som" type="button">🔔 Ativar Som</button>
        </div>
    </header>

    <div class="colunas-entregador">
        <section class="coluna-entregador">
            <h2>Prontos para Retirar</h2>
            <div id="lista-para-retirar"><p>Carregando pedidos...</p></div>
        </section>
        <section class="coluna-entregador">
            <h2>Em Rota (Retirados)</h2>
            <div id="lista-em-rota"><p>Carregando pedidos...</p></div>
        </section>
    </div>

    <audio id="som-sino" src="../sounds/sino.mp3" preload="auto"></audio>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/icones.js"></script>
    <script src="js/entregador.js"></script>
</body>
</html>
